<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><title>90-Day Reset Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#14173a;--mut:#667091;--line:#e4e7f2;--brand:#4f46e5;--brand-d:#3730a3;--brand-l:#eef0ff;--accent:#ec4899;--ok:#12b886;--warn:#f59f00;--bad:#f03e3e;--pine:#4f46e5;--plum:#ec4899;--sun:#f59f00;--work:#eef0ff;color-scheme:light;box-sizing:border-box}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:background .15s,transform .12s,box-shadow .15s,border-color .15s}
button:active{transform:scale(.97)}a{color:var(--brand)}.sub{color:var(--mut);font-size:13px}p{margin:.5em 0}ul,ol{margin:.4em 0;padding-left:20px}
/* app bar */
.appbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) clamp(12px,3vw,32px) 8px}
.ab{display:flex;align-items:center;gap:10px;max-width:1500px;margin:0 auto}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#8b5cf6);display:grid;place-items:center;font-size:20px;flex:none}
.abt{min-width:0}.abt b{display:block;font-size:17px;font-weight:800;line-height:1.1}.abt small{display:block;color:var(--mut);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abr{margin-left:auto;display:flex;gap:8px;align-items:center}.seg2{display:flex;background:#eceef8;border-radius:12px;padding:3px}.seg2 button{padding:6px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut)}.seg2 button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(20,23,58,.15)}
.nudge{background:#fff0f6;color:#c2255c;border:1px solid #ffc9de;padding:8px 12px;border-radius:12px;font-weight:800;font-size:13px}
/* layout */
.top,main{max-width:1500px;margin:0 auto;padding:12px clamp(12px,3vw,32px)}.top{padding-bottom:0}main{padding-top:12px}
.hero:empty,.stats:empty{display:none}

.hero{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:20px 22px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#2b2780,#4f46e5 58%,#8b5cf6);box-shadow:0 14px 34px rgba(79,70,229,.28)}
.hero .tt{font-size:clamp(20px,3vw,28px);font-weight:800}.hero .q{margin:6px 0;font-size:14px;line-height:1.45;opacity:.95}.hero .sub2{font-size:12px;opacity:.85}
.ring{position:relative;width:78px;height:78px;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px}

.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;font-size:11px;line-height:1.25;color:var(--mut)}.stat b{display:block;font-size:22px;color:var(--ink);font-weight:800}

.card h2,.card h3{color:var(--ink);-webkit-text-fill-color:initial;background:none}
.chip{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:12px;font-weight:700;font-size:13.5px;color:var(--ink)}.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on,.btn{background:var(--brand);color:#fff;border:1px solid var(--brand);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 6px 14px rgba(79,70,229,.25)}.chip.on:hover,.btn:hover{background:var(--brand-d);color:#fff}
.chip.on{padding:8px 14px}.modes,.rowb{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
select.chip{appearance:auto}
/* nav */
.bn{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:12px;font-size:10.5px;font-weight:700;color:var(--mut)}.bn i{font-style:normal;font-size:21px;line-height:1.2}.bn button.on{color:var(--brand);background:var(--brand-l)}
/* date strip, day header */
.bar2{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center}.stripw{margin:0 -4px}
.strip{position:relative;display:flex;gap:6px;overflow-x:auto;padding:6px 4px 10px;scroll-snap-type:x proximity;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}

.pill.part{background:#fff8e1;border-color:#ffd666}.pill.full{background:#e6fcf5;border-color:#6fd8b4}.pill.tr{box-shadow:0 0 0 2px #a5b4fc}.pill.today{border-color:#fb923c}
.pill.sel{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 8px 18px rgba(79,70,229,.35)}.pill.sel small,.pill.sel i{color:#e0e3ff}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px;border-radius:20px;background:#fff;border:1px solid var(--line);margin-bottom:10px}.dh h2{margin:0;font-size:21px}
.ar{width:34px;height:34px;border-radius:50%;background:#eceef8;font-size:18px}.seg{display:flex;background:#eceef8;border-radius:12px;padding:3px;flex-wrap:wrap}.seg button{padding:6px 12px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--mut)}.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(20,23,58,.15)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;padding:9px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;display:flex;flex-direction:row;align-items:center;gap:6px}.tb i{font-style:normal;font-size:16px}.tb.on{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent)}
.pane{animation:up .3s ease}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* timeline */
.tl .row{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin:6px 0;border-radius:14px;background:#fff;border:1px solid var(--line);border-left:4px solid #93c5fd}.tl .t{width:52px;flex:none;font-weight:800;color:var(--brand);font-size:13px}.tl .ic{font-size:18px}
.tl .row.work{background:var(--work);border-left-color:#818cf8}.tl .row.meal{border-left-color:#fb923c}.tl .row.move{border-left-color:#ec4899}.tl .row.sleep{border-left-color:#8b5cf6}.tl .row.free{border-left-color:#34d399}
/* sections, food */
.sg,.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.sec,.rc{background:#fff;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(20,23,58,.04),0 8px 22px rgba(20,23,58,.05)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px}.sh b{font-size:16px;display:block}.sh span{color:var(--c);font-weight:800;font-size:18px}
.go{background:var(--c,var(--brand));color:#fff;padding:9px 16px;border-radius:12px;font-weight:700;box-shadow:0 6px 14px color-mix(in srgb,var(--c,#4f46e5) 40%,transparent)}.go:hover{filter:brightness(1.08)}

.lk{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.lk a,.vid{border:1px solid var(--line);border-radius:12px;padding:5px 12px;font-size:13px;text-decoration:none;font-weight:700;background:#fff;display:inline-block;color:var(--brand)}.lk a:hover,.vid:hover{background:var(--brand);color:#fff}
.tag{display:inline-block;font-size:11.5px;background:#eceef8;border-radius:8px;padding:1px 8px;margin-left:4px;font-weight:600}
table{border-collapse:collapse}

.lgg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.lt{padding:16px 10px;border-radius:18px;background:#fff;border:1.5px solid var(--line);text-align:center;line-height:1.3}.lt i{display:block;font-size:34px;font-style:normal}.lt b{font-size:16px}.lt small{display:block;color:var(--mut);font-size:11.5px}
.lt.on{background:#e6fcf5;border-color:#34d399}.lt.on b{color:#087f5b}
.fls{display:flex;gap:8px;flex-wrap:wrap}.fl{flex:1;min-width:96px;padding:10px;border-radius:14px;background:#fff;border:1.5px solid var(--line);text-align:center}.fl b{display:block}.fl small{color:var(--mut)}.fl.on{background:#e6fcf5;border-color:#34d399}
textarea,input[type=text],input[type=number],input[type=date],select{font:inherit;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;max-width:100%}textarea{width:100%;min-height:64px}textarea:focus,input:focus{outline:2px solid #c7d2fe;border-color:var(--brand)}
.mood{display:flex;gap:6px;margin:6px 0}.mb{font-size:24px;padding:4px 10px;border-radius:12px;background:#fff;border:1.5px solid var(--line)}.mb.on{background:#eef0ff;border-color:var(--brand);transform:scale(1.1)}
/* focus, bars */

.wk7{display:flex;gap:6px;justify-content:center;margin:0 0 10px}.wk7 button{width:38px;height:44px;border-radius:12px;background:#fff;border:1.5px solid var(--line);font-size:11px;font-weight:700;color:var(--mut);line-height:1.1}.wk7 button.full{background:#12b886;color:#fff;border-color:#12b886}.wk7 button.part{background:#ffe08a;border-color:#ffc53d;color:#5c4400}.wk7 button.sel{outline:2px solid var(--brand)}.wk7 button.off{opacity:.3}
.mission{margin:0 0 10px;padding:10px 14px;border-radius:16px;background:#eef9f5;border:1px solid #b2ecd8;cursor:pointer;font-size:13.5px}.mbar{height:7px;background:#d3f3e6;border-radius:5px;margin-bottom:6px}.mbar i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .4s}
.glance{display:none}.nextbox{margin:10px auto;padding:10px;border-radius:16px;background:#eef0ff;border:1px solid #c7d2fe;max-width:420px}.nextbox b{font-size:17px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14173a;color:#fff;padding:10px 18px;border-radius:14px;z-index:60;box-shadow:0 10px 28px rgba(0,0,0,.3);animation:up .3s;max-width:90vw;text-align:center;font-weight:600}
.cf{position:fixed;top:-30px;font-size:26px;z-index:50;pointer-events:none;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg);opacity:.2}}
/* progress */

.wb{display:flex;gap:4px;align-items:flex-end;height:70px;margin-top:6px}.wb div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}.wb i{display:block;width:100%;border-radius:6px 6px 0 0}.wb small{font-size:10px;color:var(--mut)}
.lvl{margin-bottom:6px}.lbar{height:9px;background:#eceef8;border-radius:6px;margin:4px 0}.lbar i{display:block;height:100%;border-radius:6px;transition:width .4s}
.bdg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.bdg span{font-size:12px;padding:2px 10px;border-radius:10px;background:#f0f1f8;color:#8b90ad}.bdg span.on{background:#fff3bf;color:#5c4400;font-weight:700}
/* learn */
.crs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.cc{padding:12px;border-radius:16px;background:#fff;border:1.5px solid var(--line);text-align:left}.cc span{font-size:28px}.cc b{display:block}.cc.on{border-color:var(--brand);box-shadow:0 8px 20px rgba(79,70,229,.16)}
.mod{border:1px solid var(--line);border-radius:16px;padding:10px;margin:8px 0;background:#fff}.mod.done{background:#effcf6;border-color:#9ae6c6}.mh{display:flex;gap:10px;align-items:center}.mn{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:13px}.mod.done .mn{background:var(--ok)}
.ck{padding:6px 12px;border-radius:10px;background:#eef0ff;color:var(--brand);font-weight:700;font-size:13px}.ck.on{background:var(--ok);color:#fff}
/* timer */
.tm{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:max(16px,env(safe-area-inset-top)) 16px 20px;text-align:center}.tm svg.fx{max-width:230px}.tm .big{font-size:84px;font-weight:800;color:var(--brand);line-height:1.05;font-variant-numeric:tabular-nums}.tm.rest .big{color:var(--ok)}.tm button{margin:4px}.tm h2{font-size:26px}
/* new components */
.sg2{display:flex;gap:4px;background:#e8eaf6;padding:4px;border-radius:14px;margin:2px 0 12px;overflow-x:auto;scrollbar-width:none}.sg2 button{flex:1;padding:9px 14px;border-radius:10px;font-weight:700;font-size:13px;white-space:nowrap;color:var(--mut)}.sg2 button.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(20,23,58,.14)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;align-items:start}.tgrid .card{margin:0}
.tch{display:flex;align-items:center;gap:10px;margin-bottom:10px}.tch i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--t,#eef0ff);font-style:normal;font-size:20px;flex:none}.tch b{font-size:16px;font-weight:800;display:block;line-height:1.2}.tch .sub{display:block}

.hab{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hab button{display:flex;align-items:center;gap:8px;padding:10px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;text-align:left}.hab button.on{background:#e6fcf5;border-color:#34d399;color:#087f5b}
.bigbar{height:8px;background:#eceef8;border-radius:6px;overflow:hidden;margin:8px 0}.bigbar i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#ec4899);border-radius:6px;transition:width .4s}
.snum{font-size:60px;font-weight:800;line-height:1;color:#ea580c}.flame{font-size:44px;vertical-align:middle}.cbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.cbtn{padding:12px 6px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:13px;line-height:1.25}.cbtn small{display:block;font-weight:500;color:var(--mut);font-size:11px}.cbtn.c.on{background:#e6fcf5;border-color:#34d399;color:#087f5b}.cbtn.t.on{background:#fff8e1;border-color:#ffc53d;color:#8a5a00}.cbtn.j.on{background:#fff1f2;border-color:#fda4af;color:#be123c}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}.dots i{width:18px;height:18px;border-radius:6px;background:#e4e7f2;display:block}.dots i.c{background:#12b886}.dots i.t{background:#ffc53d}.dots i.j{background:#fb7185}
.cl{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:#fff;border:1.5px solid var(--line);margin:6px 0;width:100%;text-align:left}.cl .bx{width:24px;height:24px;border-radius:8px;border:2px solid #c3c8e0;display:grid;place-items:center;flex:none;font-size:14px;color:#fff}.cl.on{background:#effcf6;border-color:#8be0be}.cl.on .bx{background:var(--ok);border-color:var(--ok)}.cl b{font-weight:700;font-size:14px}.cl small{display:block;color:var(--mut);font-size:12px}
.gh{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.gal .card{margin:0;padding:12px}.gal .card b{font-size:15px}.gal p{font-size:13px;color:#3d4266}
.note{background:#fff8e6;border:1px solid #ffe08a;border-radius:14px;padding:10px 12px;font-size:13px;margin:8px 0}.warn{background:#fff1f2;border:1px solid #fecdd3}
.ci{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.ci label{font-size:12px;color:var(--mut);display:block}.ci input{width:100%}
@media(min-width:960px){body{padding-bottom:0;padding-left:88px}
.bn{top:0;bottom:0;right:auto;width:88px;flex-direction:column;justify-content:flex-start;gap:4px;padding:14px 8px;border-top:0;border-right:1px solid var(--line);background:#fff}.bn button{padding:10px 0;font-size:11px}.bn i{font-size:24px}
.appbar{padding-left:clamp(12px,3vw,32px)}.pane .tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:8px}.tl .row{margin:0}.pill{width:62px}.toast{bottom:30px}.dh h2{font-size:24px}}

.bar2 select.chip{flex:1 1 150px;min-width:0}.bar2 .chip{padding:7px 12px}

.gal{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}.gal svg.fxb{max-width:100%}.gal .card b{font-size:14px}.gal p{font-size:12px}
.hero .tt{font-size:clamp(19px,2.6vw,26px)}

.datebar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 10px;margin:0 0 12px;flex-wrap:wrap}.dbm{flex:1;min-width:110px;text-align:center}.dbm b{display:block;font-size:15px}.dbm small{color:var(--mut);font-size:11px}.datebar input{padding:6px 8px;font-size:13px}

const EX={palm:['Palming','Rub your palms together until warm. Close your eyes and cup your palms over them without pressing on the eyeballs, fingers resting on the forehead. Breathe slowly and enjoy the darkness and warmth.'],eupdn:['Eyes up and down','Sit tall and keep your head still. Look up as far as is comfortable, then down, slowly, with steady breathing. Repeat smoothly without straining.'],elr:['Eyes left and right','Keep your head still. Look to the far left, then the far right, slowly and smoothly without straining.'],ediag:['Eye diagonals','Keep your head still. Move your eyes along the diagonal named, from one corner to the opposite corner and back. Move slowly.'],ecirc:['Eye circles','Keep your head still and draw a big slow circle with your eyes, as if tracing a clock face. Follow the direction named, then reverse.'],enear:['Near and far focus','Hold your thumb at arm length and focus on it. Slowly bring it toward your nose while keeping it sharp, then look at something far away. Repeat.'],eblink:['Blinking','Blink gently and quickly about 20 times, then close your eyes for a few seconds. This refreshes the eyes after screen time.'],trat:['Trataka (steady gazing)','Place a small dot or a candle flame at eye level about an arm length away. Gaze at it steadily without forcing, blinking when needed. Finish by closing your eyes and resting. Skip it if you have an eye condition, or ask your eye doctor first.'],fsmile:['Cheek lifter','Smile gently with lips closed and lift the cheeks up toward the eyes. Rest your fingertips lightly on the cheekbones and hold the lift without pushing hard.'],ffish:['Fish face','Suck your cheeks in to make a fish face, then try to smile while holding it. Hold, then release.'],fpuff:['Cheek puff','Fill your cheeks with air and move the air slowly from one cheek to the other, then into both, then release.'],fjaw:['Jaw release','Open your mouth gently as if yawning and move the jaw slowly from side to side. Then massage the muscles in front of the ears in small circles with your fingertips.'],fbrow:['Eyebrow lifter','Place your fingertips just under the eyebrows. Lift the eyebrows up against gentle finger resistance, hold, then relax.'],ffore:['Forehead smoother','Place your palms flat on the forehead. Raise the eyebrows against the light pressure while sliding the palms out toward the temples. Relax.'],fchin:['Chin lift','Tilt your head back, look at the ceiling and push the lower jaw forward as if kissing the ceiling. Hold the stretch, then release. Go gently if your neck is sensitive.'],ftongue:['Tongue press','Press the whole tongue against the roof of your mouth and tilt the head slightly back. You should feel a gentle effort under the chin. Hold, then release.'],fmass:['Face massage','With clean hands and light pressure, stroke from the centre of the face outward: chin to ears, nose to temples, forehead to hairline. Keep the strokes gentle.'],vajra:['Vajrasana (thunderbolt)','Kneel and sit back on your heels with the spine tall and hands on the thighs. Place a cushion under the knees or hips if it is uncomfortable.'],chakra:['Chakrasana (wheel pose)','An advanced backbend. Lie on your back with feet flat and hands beside the ears, press into hands and feet and lift the hips and chest into an arch. Skip it, or do bridge pose instead, if you have wrist, shoulder, neck or back pain, or feel dizzy. Come down slowly.'],ptilt:['Pelvic tilt','Lie on your back with knees bent. Gently flatten the lower back toward the floor by tilting the pelvis, then release. Small, slow movements. Stop if anything hurts.'],apana:['Apanasana (knees to chest)','Lie on your back and hug one or both knees toward the chest, relaxing the lower back. Keep the movement small and comfortable.'],sphinx:['Sphinx pose','Lie on your belly and prop up on the forearms with elbows under the shoulders. Keep the lower back relaxed and the hips heavy. A gentle back extension.'],uttan:['Uttanasana (standing forward bend)','Stand with feet hip-width, bend the knees and fold forward from the hips, letting the head and arms hang. Keep the knees soft and roll up slowly.'],anj:['Anjaneyasana (low lunge)','Step one foot forward into a lunge, lower the back knee to the floor, lift the chest and sink the hips forward. Stretches the front of the thigh and hip.'],ardhamat:['Ardha matsyendrasana (seated twist)','Sit tall, cross one foot over the opposite knee and twist toward the bent knee, holding the knee or the floor behind you. Keep the spine long.'],janu:['Janu sirsasana (head-to-knee forward bend)','Sit with one leg straight and the other foot against the inner thigh. Hinge forward over the straight leg with a long spine. Bend the knee if the hamstring is tight.'],upav:['Upavistha konasana (wide-leg forward bend)','Sit with the legs wide apart and hinge forward from the hips with a long back, hands on the floor in front of you.'],sala:['Salabhasana (locust pose)','Lie on your belly, lift the chest and legs a few inches off the floor and hold. Keep the neck long. Strengthens the back.'],trik:['Trikonasana (triangle pose)','Feet wide, turn one foot out, reach sideways over that leg and rest the hand on the shin, other arm reaching up. Stretches the hamstrings and the sides.'],taada:['Tadasana (mountain pose)','Stand tall with feet together, arms by your sides, spine long and shoulders relaxed. Breathe slowly.'],quad:['Standing quad stretch','Stand tall holding a wall for balance. Bend one knee and hold the foot behind you, knees together. Stretches the front of the thigh.'],suppad:['Supta padangusthasana (reclined hamstring stretch)','Lie on your back. Loop a towel or belt around one foot and lift that leg straight up, keeping the other leg flat. Stretches the back of the thigh.'],shava:['Shavasana (relaxation)','Lie flat on your back with palms up and eyes closed. Let the whole body go heavy and breathe naturally.'],trow:['Towel row','Loop a towel around a sturdy door handle or post, hold both <details open><summary>Food plan (28-day menu that repeats)</summary><ul><li>Lunch and dinner follow a 4-week menu that repeats every 4 weeks. Weekends are easy meals. Rice only on Thursday and Sunday lunches (idli counts as rice).</li><li>No paneer in breakfast or dinner, no pumpkin, and yellow dal and mix dal count as the same dish, at most once a week.</li><li>Roti: whole wheat daily is fine. Wednesday uses missi roti (wheat + besan). Check multigrain atta for soy, bajra or ragi.</li><li>Bread dinners (sandwiches, toast) use whole-grain bread without soy. Roti wraps work if you prefer.</li></ul></details>
<details><summary>Nano's workout (from your screenshots)</summary><ul><li>Order every day: cardio, strength, yoga, breath work, then meditation (15 minutes). Wake at 6:20 AM, freshen up and start at 6:30 (your wake time moves a few minutes earlier when the workout grows).</li><li>Mon lower body, Tue core, Wed upper body, Thu yoga, Fri full body, Sat yoga, Sun full body. Strength is 50 seconds per exercise, 2 sets for the first 30 days, then 3. Dumbbells are the normal version. Tap No dumbbells for an equally effective bodyweight version.</li><li>Cardio: 2 minutes slow and 3 minutes fast cycling, then 5 rounds of Suryanamaskar at 35 seconds each. Travel mode: 10 rounds of Suryanamaskar at 35 seconds each, plus the no-dumbbell strength.</li><li>Yoga: 2 sets of 50 seconds per asana, standing first, then sitting, then lying down. Poses with two sides go right first, then left. The last poses are always viparita karani, sarvangasana and halasana, then a 40-second break, then chakrasana and matsyasana as counter poses. There is a 45-second break after the first round. Thursday and Saturday end with 30 sets of 50 seconds for your pending poses.</li><li>Breath work: kapalbhati and bhastrika 2 sets of 45 seconds with 15-second gaps, uddiyana 5 sets of 20 seconds with 10-second gaps, then surya bhedana, ujjayi, bhramari and anulom vilom at the end. Do uddiyana on an empty stomach, and skip kapalbhati, bhastrika and uddiyana during periods or if you feel dizzy or your heart races.</li><li>Low / period days: 5 minutes of easy cycling, the same strength exercises as that day but only 1 round, the same yoga as that day but only 1 round with inversions and deep backbends removed, gentle breathing and 15 minutes of meditation.</li><li>Evening (around 5 PM): eye yoga (about 8 minutes) and face yoga (about 8 minutes) with timers. These are general wellness exercises, not medical treatment. Skip trataka if you have an eye condition.</li><li>Chakrasana is an advanced backbend. Skip it, or do bridge pose instead, if you have wrist, shoulder, neck or back pain, or feel dizzy. Skip shoulder stand and plow if your neck is sensitive. Yoga helps relaxation and fitness but does not treat a thyroid problem.</li></ul></details>
<details><summary>Akshay's workout plan</summary><ul><li>Order: cardio, warm-up, strength, yoga, then 15 minutes of meditation. Strength every day with his 5 kg dumbbells (tap No dumbbells for a bodyweight version): Mon chest + triceps, Tue back + biceps, Wed legs + glutes, Thu shoulders + core, Fri full body, Sat fat-burn circuit, Sun light full body.</li><li>Because of his reduced spinal gap and tailbone discomfort, I avoided jumping, heavy twisting and leg raises, and his yoga is only about 14 minutes of gentle back movements. These cannot treat the problem, so please get his doctor or physiotherapist to approve the plan. Stop at once if there is sharp pain, numbness or tingling.</li><li>Eye yoga (about 8 minutes) is in the evening section, which he can do at his desk. The timer says each new pose out loud and shows the next exercise with a video link during rests.</li><li>He works 9 AM to 9 PM with meals at his desk, so he trains before work and sleeps around 11 PM.</li></ul></details>
<details open><summary>Is this workload safe for Nano?</summary><p>Your routine is about 1 h 20 to 1 h 35 min a day. With a TSH of 7, a resting heart rate of 100-110 that has not been assessed, irregular periods and low vitamin D, please get your doctor's clearance, especially for the forceful breathing and the heavier strength work.</p><ul><li>Your wake time is about 6:05 AM and about 5:50 AM once strength goes to 3 sets, so you should be asleep by about 10:30 PM. Bedtime moves from midnight to 10:30 PM over the first 8 weeks, so early on you will sleep only about 6 hours. Use Low / period or Hold when tired.</li><li>This much exercise on a low body weight needs enough food. See the calorie card in the Guide.</li></ul></details>
<details><summary>Thyroid-aware food notes</summary><ul><li>I removed soy (soya bean, soya chunks, tofu, soy sauce), cabbage, cauliflower and similar vegetables, and bajra/ragi flours from the plan. In large amounts they may affect thyroid function or medicine absorption in some people. Normal amounts are usually fine, so this is a cautious choice. Ask your doctor.</li><li>Use iodized salt. Do not take iodine, kelp or other supplements unless your doctor advises.</li><li>Check that your protein powder is pea or plant-based and soy-free. Tell your doctor about every supplement.</li><li>If you start thyroid medicine, take it exactly as prescribed, and ask how far to space calcium, iron and fibre supplements.</li><li>Cooked spinach and the other vegetables here are fine in normal amounts.</li></ul></details>
<details><summary>Medical follow-up (do this week)</summary><ul><li>Book a GP or endocrinologist. Bring your TSH report, old vitamin D and cholesterol reports, recent period dates, and a few resting heart rate readings.</li><li>Ask: Is a TSH of 7 treated or monitored? Do I need free T4 and anti-TPO? Should my resting heart rate of 100-110 be checked (ECG)? Do I need PCOS tests? Am I cleared for gradual exercise?</li><li>Ask about a recheck in 6-8 weeks to decide on medication.</li><li>Stop exercise and seek care for chest pain, fainting, unusual breathlessness, or a racing heart that does not settle.</li><li>Until cleared, keep all movement at an easy, talk-in-sentences pace. This plan is general lifestyle guidance, not medical advice.</li></ul></details>
<details><summary>Sleep and weekly progression table</summary><p>Wake time moves earlier by 15-30 minutes a week, and bedtime moves with it so sleep stays near 7 hours. Do not progress to the next week if you could not keep this week's bedtime on 5 of 7 nights (use the Hold button).</p>${progTable()}<p class="sub">Get daylight after waking, no caffeine after 2 PM, dim screens 30 minutes before bed. If you are short on sleep, a 20-minute nap before 3 PM is fine.</p></details>
<details><summary>Cravings and sweets</summary><ul><li>Eat protein at breakfast and lunch. Cravings are often fatigue or under-eating.</li><li>Plan a small treat after dinner. Keep binge foods out of the house, single servings only.</li><li>When a craving hits, do 5 slow breaths and drink water, then decide. You can still eat it.</li></ul></details>
<details><summary>Takeout and restaurant picks</summary><p>Good defaults: dal tadka + rice, paneer tikka or bhurji, idli/dosa with sambar, khichdi, rajma chawal, veg pulao + raita, paneer sandwich. Rule: one protein item plus one vegetable item. Pizza, biryani and burgers stay in rotation.</p></details>
<details><summary>Setback playbook</summary><ul><li><b>Junk food all day:</b> water, normal protein breakfast tomorrow. No fasting or making up.</li><li><b>Very late night:</b> keep wake time within 1-2 hours, daylight, nap before 3 PM, bed 30 min earlier.</li><li><b>Missed exercise for days:</b> 5 min stretching today, 10 min walk tomorrow.</li><li><b>Lost motivation:</b> minimums only for 3 days (tap Low energy).</li><li><b>Back from a trip:</b> two easy days, restock the shelf, resume on day 3.</li><li><b>"I failed again":</b> look at the last 7 days, find three things you did, do the next smallest one.</li></ul></details>
<details><summary>Exercise progression</summary><p>All your exercises are included from day 1. For Nano: strength is 2 sets for the first 30 days, then 3 sets. Meditation builds from 8 to 15 minutes and ujjayi from 15 to 18 rounds. For Akshay: more exercises, sets and work time with shorter rests. Hold a week if you are tired.</p></details>

const COURSES=[
{id:'pp',emoji:'⚡',name:'Power Platform to Copilot and agents',sub:'You know Power Apps, Power Automate and Dataflows. This course adds Copilot Studio, agents, actions (plug-ins) and AI.',mods:[
{id:'pp1',t:'Meet Copilot Studio and agents',time:'45 min',easy:'Copilot Studio is the Power Platform tool for building AI assistants, called agents. An agent is like a helpful colleague in a chat window: it answers questions from your data and can do tasks for people. You build it with clicks and plain English, much like building an app in Power Apps.',v:[['Create your first agent (Microsoft Learn video)',LRN+'shows/mastering-copilot-studio/create-first-agent-copilot-studio']],d:[['Quickstart: create and deploy an agent',LRN+'microsoft-copilot-studio/fundamentals-get-started?tabs=web'],['Start a free trial','https://aka.ms/trycopilotstudio']]},
{id:'pp2',t:'Create an agent by talking to Copilot',time:'30 min',easy:'You can create an agent just by describing it. You answer questions in plain language and Copilot fills in the name, description and instructions. You can then edit them, add an image and test the agent before publishing. You can also set how strict it is about answering (the content moderation level).',v:[['Episode 1: Create an agent using natural language',L1+'1']],d:[['Create an agent with natural language','https://aka.ms/mcs/CreateWithNL']]},
{id:'pp3',t:'Topics: planned conversations',time:'30 min',easy:'A topic is a small planned conversation, like a flowchart: if the user asks X, ask Y, then show Z. You can describe a topic in plain English and Copilot builds the steps, then use Edit with Copilot to change it.',v:[['Episode 6: Author topics using natural language',L1+'6']],d:[['Create and edit topics with Copilot','https://aka.ms/mcs/topics']]},
{id:'pp4',t:'Knowledge: let the agent read your content',time:'40 min',easy:'Knowledge is the information your agent can look things up in: uploaded files, public websites, SharePoint, OneDrive and Dataverse tables. The agent answers from these instead of guessing. This is called grounding. Users only get answers from content they are allowed to open.',v:[['Episode 2: Add knowledge to your agents',L1+'2']],d:[['Knowledge in Copilot Studio',LRN+'microsoft-copilot-studio/knowledge-copilot-studio'],['Add knowledge to your agent','https://aka.ms/mcs/knowledge']]},
{id:'pp5',t:'Actions (plug-ins for agents): make the agent do things',time:'45 min',easy:'Actions are tools that let the agent do things, not only talk. It can use a connector (the Power Platform has over 1,400), call an API, run a Power Automate flow or run a saved AI prompt. Older material calls these plug-in actions. Think of them as buttons the agent can press for the user.',v:[['Episode 4: Add actions to your agent using connectors',L1+'4']],d:[['Use actions with agents','https://aka.ms/mcs/actions'],['Hands-on module: add tools to an agent',LRN+'training/modules/copilot-tools-online-workshop/introduction']]},
{id:'pp6',t:'Prompts as tools (AI Builder)',time:'30 min',easy:'A prompt is a saved instruction for the AI model, with inputs you can fill in, for example "summarize the donations for this fundraiser". You can ground it in Dataverse data and reuse it inside agents, flows and apps.',v:[['Episode 3: Build prompt actions for your agent',L1+'3']],d:[['Use prompts in your agent','https://aka.ms/mcs/prompt-node'],['AI Builder prompting guide','https://aka.ms/promptguide'],['Prompt library','https://aka.ms/powerplatform-prompts']]},
{id:'pp7',t:'Agent flows: automation inside Copilot Studio',time:'45 min',easy:'Agent flows are Power Automate-style flows built inside Copilot Studio. They run the same steps every time, so they are predictable, and an agent can call them as a tool. You can build one by describing it in words. Each action they run uses Copilot Studio capacity.',v:[],d:[['Agent flows overview',LRN+'microsoft-copilot-studio/flows-overview'],['Hands-on module: build an agent flow',LRN+'training/modules/copilot-tools-online-workshop/introduction']]},
{id:'pp15',t:'Dataverse plug-ins (C# server-side logic)',time:'60 min',easy:'A plug-in is code that runs inside Dataverse when something happens to a row, such as before or after it is created, updated or deleted. Use it for checks and calculations that must always run, no matter whether the change came from an app, a flow or an API. It is written in C# (Visual Studio or the Power Platform CLI) and then registered with the Plug-in Registration tool. Synchronous plug-ins run during the save, asynchronous ones run just after in the background.',v:[],d:[['Write a plug-in',LRN+'power-apps/developer/data-platform/write-plug-in'],['Tutorial: write and register a plug-in',LRN+'power-apps/developer/data-platform/tutorial-write-plug-in'],['Register a plug-in',LRN+'power-apps/developer/common-data-service/register-plug-in']]},
{id:'pp16',t:'Low-code plug-ins with Power Fx',time:'45 min',easy:'You can reuse Power Fx formulas as shared server-side logic that apps and flows can call. Some run on demand, and automated ones run when a Dataverse table changes, so the same rule applies everywhere. Microsoft says instant low-code plug-ins are being replaced by Functions in Dataverse (preview), so check the latest docs before you build.',v:[],d:[['Use low-code plug-ins in Dataverse',LRN+'power-apps/maker/data-platform/low-code-plug-ins'],['Module: low-code plug-ins',LRN+'training/modules/configure-low-code/low-code-plug-ins'],['Module: use connectors in plug-in logic',LRN+'training/modules/common-low-code-plug-in/use-connectors-plug-in-logic'],['Announcement and overview','https://www.microsoft.com/en-us/power-platform/blog/power-apps/dataverse-low-code-plug-ins-now-in-public-preview/']]},
{id:'pp8',t:'Safe access: authentication for actions',time:'25 min',easy:'Every action uses a login to reach its data. You choose whether it runs as the person who built the agent or as each user. User authentication means each person only gets what they are already allowed to see.',v:[['Episode 5: User authentication for actions',L1+'5']],d:[['Authentication for actions','https://aka.ms/mcs/user-auth']]},
{id:'pp9',t:'Autonomous agents',time:'45 min',easy:'Most agents wait for a person to chat. Autonomous agents start by themselves when something happens, such as a new email or a new row, and then use their knowledge and actions to handle it.',v:[],d:[['Hands-on module: build an autonomous agent',LRN+'training/modules/autonomous-agent/']]},
{id:'pp10',t:'Extend Microsoft 365 Copilot with your own agent',time:'40 min',easy:'Microsoft 365 Copilot is the AI helper inside apps like Teams and Outlook. You can customize it with your own agent by writing instructions and adding your knowledge and actions. This is how company data and connector actions reach everyday Microsoft 365 users.',v:[],d:[['Module: extend declarative agents with connector actions',LRN+'training/modules/create-connector-actions-microsoft-copilot-microsoft-365-copilot-studio']]},
{id:'pp11',t:'Copilot that helps you build apps and flows',time:'30 min',easy:'In Power Apps and Power Automate you can describe what you want in words and Copilot drafts the app or the flow. You then check and refine it, the same way you already build. Look for the Copilot option in the maker portals and search the docs for Copilot.',v:[['Official series: AI in Action, Building with Copilot Studio','https://aka.ms/ai-in-action/building-with-mcs']],d:[['Power Apps documentation',LRN+'power-apps/'],['Power Automate documentation',LRN+'power-automate/']]},
{id:'pp12',t:'The big picture of low-code AI apps',time:'30 min',easy:'This short lesson shows how generative AI fits into low-code tools: what you can build without writing much code and where the limits are. It helps you explain AI options to your team.',v:[['Microsoft lesson 10: Building low-code AI applications',G+'10-gh']],d:[['Generative AI for Beginners course site','https://microsoft.github.io/generative-ai-for-beginners/']]},
{id:'pp13',t:'Governance, security and cost',time:'45 min',easy:'Before agents go live, decide who may build them, what data they can reach and how usage is paid for. Copilot Studio usage is measured as capacity, and admins review it in the Power Platform admin center. Also keep an eye on What is new, because this area changes often.',v:[],d:[['Copilot Studio documentation home',LRN+'microsoft-copilot-studio/'],['What is new in Copilot Studio',LRN+'microsoft-copilot-studio/whats-new'],['Implementation guide','https://aka.ms/CopilotStudioImplementationGuide'],['Learning resources','https://aka.ms/copilotstudiolearn']]},
{id:'pp14',t:'Capstone: build one real agent',time:'2 to 3 hours',easy:'Pick a real need, such as an IT or HR helpdesk. Create the agent, add one knowledge source, add one action (a connector or a flow), test it, then publish it to Teams. Write down what you learned. This one project makes the rest stick.',v:[['Revisit: Create your first agent',LRN+'shows/mastering-copilot-studio/create-first-agent-copilot-studio']],d:[['Quickstart',LRN+'microsoft-copilot-studio/fundamentals-get-started?tabs=web']]}]},
{id:'ai',emoji:'🧠',name:'AI knowledge: how it works and how to use it',sub:'Just to gain knowledge. No coding needed. Short videos from Microsoft, 3Blue1Brown and Andrej Karpathy.',mods:[
{id:'ai1',t:'What AI and generative AI mean',time:'30 min',easy:'Artificial intelligence is software that does things that normally need human thinking. Generative AI creates new text, images or code. Large language models, or LLMs, are the engines behind chat tools like ChatGPT and Claude.',v:[['Microsoft lesson 1: Intro to generative AI and LLMs',G+'-1-gh']],d:[['Course site','https://microsoft.github.io/generative-ai-for-beginners/']]},
{id:'ai2',t:'How ChatGPT-style models work (no maths)',time:'30 min',easy:'An LLM reads text, breaks it into small pieces called tokens, and predicts the next piece again and again. Something called attention lets it focus on the important words. It does not look facts up, it predicts likely text, which is why it can sound sure and still be wrong.',v:[['3Blue1Brown: But what is a GPT? (27 min)','https://www.youtube.com/watch?v=wjZofJX0v4M']],d:[]},
{id:'ai3',t:'The one-hour tour of LLMs',time:'1 hour',easy:'Andrej Karpathy explains what an LLM really is: a big file of numbers plus a small program, how it is trained, and why it is like a new kind of operating system. A very clear talk for non-experts.',v:[['Karpathy: Intro to Large Language Models (1 hour)','https://www.youtube.com/watch?v=zjkBMFhNj_g']],d:[]},
{id:'ai4',t:'Choosing the right model',time:'30 min',easy:'There are many models, big and small, paid and free. They differ in quality, speed, cost and privacy. The right choice depends on the job, the same way you pick the right tool from a toolbox.',v:[['Microsoft lesson 2: Exploring and comparing different LLMs',G+'2-gh']],d:[]},
{id:'ai5',t:'Talking to AI well: prompting',time:'45 min',easy:'A prompt is your instruction to the AI. Clear prompts get better answers: say who it should act as, give the task, add examples and say the format you want. The second lesson shows techniques that improve results further.',v:[['Microsoft lesson 4: Prompt engineering fundamentals',G+'4-gh'],['Microsoft lesson 5: Creating advanced prompts',G+'5-gh']],d:[]},
{id:'ai6',t:'When AI gets it wrong: responsible AI',time:'30 min',easy:'AI can make up facts, show bias and leak private data. Responsible AI means checking its answers, protecting sensitive information, being fair and being open about where AI is used.',v:[['Microsoft lesson 3: Using generative AI responsibly',G+'3-gh']],d:[]},
{id:'ai7',t:'Giving AI your own data: RAG',time:'45 min',easy:'RAG stands for retrieval augmented generation. The system first searches your documents for the relevant parts, then hands them to the AI to write the answer. That is how an assistant can answer questions about your own files. Copilot Studio knowledge works on the same idea.',v:[['Microsoft lesson 15: RAG and vector databases',G+'15-gh']],d:[]},
{id:'ai8',t:'Agents and tools',time:'45 min',easy:'An agent is an AI that can use tools to get things done: search, send emails, update records. The model decides which tool to call and when. This is the same idea as actions in Copilot Studio.',v:[['Microsoft lesson 11: Function calling',G+'11-gh'],['Microsoft lesson 17: AI agents',G+'17-gh']],d:[]},
{id:'ai9',t:'Customizing models: fine-tuning',time:'30 min',easy:'You can improve results by better prompts, by giving the model your documents (RAG), or by fine-tuning, which trains the model further on your examples. Prompts and RAG come first. Fine-tuning is the heavier last option.',v:[['Microsoft lesson 18: Fine-tuning LLMs',G+'18-gh']],d:[]},
{id:'ai10',t:'AI security: jailbreaks and prompt injection',time:'40 min',easy:'People can trick AI systems with hidden instructions, called prompt injection, or push them to break their rules, called jailbreaking. Anything that reads outside content needs safeguards, especially agents that can act.',v:[['Microsoft lesson 13: Securing AI applications',G+'13-gh'],['Karpathy: the security section (from 45:43)','https://www.youtube.com/watch?v=zjkBMFhNj_g&t=2743s']],d:[]},
{id:'ai11',t:'Where it is heading',time:'20 min',easy:'Karpathy describes LLMs as the center of a new kind of operating system that connects tools, files and other models. Watch this part to picture where agents and assistants are going.',v:[['Karpathy: LLMs as an operating system (from 42:00)','https://www.youtube.com/watch?v=zjkBMFhNj_g&t=2520s']],d:[]}]}];

D('🍓 Strawberry legs (dark dots and bumps)','<p>Usually keratosis pilaris (keratin plugging the hair follicles, often in families), dry skin, or clogged and irritated pores after shaving.</p><ol><li>Short, lukewarm showers. Hot water dries the skin.</li><li>Exfoliate chemically, not with rough scrubs: 2 to 3 nights a week with a lotion containing urea (10 to 20%), lactic acid, glycolic acid (5 to 10%) or salicylic acid.</li><li>Moisturize right after the bath every day with a urea or ceramide lotion.</li><li>Shave smart: a clean, sharp razor, shaving gel, with the hair direction. Do it on a different night from exfoliating, and change blades often. Trimming irritates less.</li><li>Be patient. Bumps often improve over weeks but can return, so keep a light maintenance routine. See a dermatologist if the skin is red, itchy or painful.</li></ol>')+
